<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Cat</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/road.css">
    <link rel="stylesheet" href="style/battle.css">
    <script type="module" src="script/main.js"></script>
</head>

<body>
    <nav class="screen-navigation" aria-label="화면 선택">
        <button type="button" id="show-road">Road</button>
        <button type="button" id="show-battle">Battle</button>
    </nav>

    <main>
        <section id="Road" class="screen-active road-screen" aria-label="Road 화면">
            <header class="road-header">
                <div><span class="road-eyebrow">티니와 함께 걷는 길</span><h1 id="road-title">이름 없는 숲</h1></div>
                <div class="road-resources"><span id="road-token">토큰 10</span><span id="road-token-change" class="road-token-change" aria-live="polite"></span><span id="road-debt" hidden></span><button type="button" id="road-restart">다시 시작</button></div>
            </header>
            <div id="road-view" tabindex="0" aria-label="게임 화면"></div>
            <footer class="road-footer"><span id="road-instructions">WASD 이동 · E 상호작용</span><span id="road-progress"></span></footer>
            <p id="road-status" class="road-status" role="status" aria-live="polite"></p>
            <button type="button" id="road-help" class="road-help" aria-label="티니에게 도움 요청하기" aria-controls="road-chat-panel" aria-expanded="false"><span id="road-help-nudge" class="road-help-nudge" role="status" hidden></span><img src="./images/character/cat/cat_front.png" alt=""><span class="road-help-copy"><strong>도움</strong><small>티니에게 물어보기</small></span></button>
            <section id="road-chat-panel" class="road-chat-panel" aria-labelledby="road-chat-title" hidden>
                <header class="road-chat-header">
                    <img src="./images/character/cat/cat_front.png" alt="">
                    <div><h2 id="road-chat-title">티니</h2><span>숲길을 안내하는 고양이</span></div>
                    <button type="button" id="road-chat-close" aria-label="티니 대화 닫기">×</button>
                </header>
                <div id="road-chat-log" class="road-chat-log" role="log" aria-label="티니와의 대화" aria-live="polite" aria-relevant="additions"></div>
                <form id="road-chat-form" class="road-chat-form">
                    <label for="road-chat-input" class="road-sr-only">티니에게 메시지 보내기</label>
                    <div class="road-chat-composer">
                        <textarea id="road-chat-input" rows="2" maxlength="300" placeholder="티니에게 메시지 보내기…" aria-describedby="road-chat-command-guide"></textarea>
                        <button type="submit" id="road-chat-send" aria-label="메시지 전송">↑</button>
                    </div>
                    <p id="road-chat-command-guide">/hint 1 · /plan 3 · /solve 8 토큰</p>
                </form>
            </section>
            <div class="road-controls" id="road-controls" aria-label="이동 조작">
                <button type="button" data-move="up" aria-label="위로 이동">↑</button>
                <button type="button" data-move="left" aria-label="왼쪽으로 이동">←</button>
                <button type="button" data-move="down" aria-label="아래로 이동">↓</button>
                <button type="button" data-move="right" aria-label="오른쪽으로 이동">→</button>
                <button type="button" id="road-interact" aria-label="E · 상호작용">E · 확인</button>
            </div>
            <dialog id="road-flow-dialog" aria-labelledby="road-flow-title"></dialog>
            <dialog id="road-modal" aria-labelledby="road-modal-title">
                <div class="road-modal-top"><h2 id="road-modal-title"></h2><button type="button" id="road-modal-close" aria-label="닫기">×</button></div>
                <div id="road-modal-body"></div>
            </dialog>
        </section>

        <section id="Battle" class="screen" aria-label="Battle 화면">
            <canvas id="battle-canvas"></canvas>
            <section class="battle-status enemy-status" id="enemy-status" aria-label="적 상태">
                <p class="status-name">늑대</p>
                <div class="status-bar health-bar" role="progressbar" aria-label="적 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                    <span class="status-fill"></span>
                </div>
                <div class="status-bar stamina-bar enemy-stamina-bar" role="progressbar" aria-label="적 스태미나" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                    <span class="status-fill"></span>
                </div>
            </section>
            <section class="battle-status player-status" id="player-status" aria-label="플레이어 상태">
                <p class="status-name">플레이어</p>
                <div class="status-row">
                    <div class="status-bar health-bar" role="progressbar" aria-label="플레이어 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="player-health-value">100 / 100</span>
                </div>
                <div class="status-row stamina-row">
                    <div class="status-bar stamina-bar" role="progressbar" aria-label="플레이어 스태미나" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="player-stamina-value">100 / 100</span>
                </div>
            </section>
            <section id="fight-skills-dialog" class="fight-skills-dialog" role="dialog" aria-label="공격 기술 선택"
                aria-modal="true" hidden>
                <img class="fight-skills-panel" src="./images/battle/fight_skills_panel.png" alt="">
                <div class="fight-skills-list">
                    <button type="button" class="fight-skill-button" aria-label="일반 공격, 위력 10, 명중률 100, 소모 스태미나 20">
                        <img src="./images/battle/skill_row_general_attack.png" alt="">
                    </button>
                    <button type="button" class="fight-skill-button" aria-label="힘껏 휘두르기, 위력 20, 명중률 70, 소모 스태미나 30">
                        <img src="./images/battle/skill_row_heavy_swing.png" alt="">
                    </button>
                    <button type="button" class="fight-skill-button" aria-label="숨 고르기, 체력 10 및 스태미나 40 회복, 소모 스태미나 0">
                        <img src="./images/battle/skill_row_breathe.png" alt="">
                    </button>
                </div>
            </section>
            <dialog id="battle-loss-dialog" class="battle-loss-dialog" aria-labelledby="battle-loss-text">
                <p id="battle-loss-text">다시 해보자</p>
                <button type="button" id="battle-loss-confirm">확인</button>
            </dialog>
            <div class="menu-section">
                <img id="menu-background" src="./images/battle/battle_menu.png" alt="">
                <div id="menu-text">
                    <p id="ai-recommendation">도망가자!<br>이길 수 있는 상대가 아니야!</p>
                </div>
                <button id="fight-button" aria-label="싸우기">
                    <img src="./images/battle/fight_button.png" alt="">
                </button>
                <button id="bag-button" aria-label="가방">
                    <img src="./images/battle/bag_button.png" alt="">
                </button>
                <button id="run-button" aria-label="도망가기">
                    <img src="./images/battle/run_button.png" alt="">
                </button>
            </div>
        </section>
    </main>
</body>

</html>
