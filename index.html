<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Cat</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/road.css">
    <link rel="stylesheet" href="style/battle.css?v=14">
    <script type="module" src="script/main.js"></script>
</head>

<body>
    <nav class="screen-navigation" aria-label="화면 선택">
        <button type="button" id="show-road">Road</button>
        <button type="button" id="show-battle">Battle</button>
    </nav>

    <main>
        <section id="Road" class="screen-active road-screen" aria-label="Road 화면">
            <h1 class="road-visually-hidden">숲길 탐험</h1>
            <div class="road-viewport" id="road-viewport" tabindex="0" aria-label="WASD 또는 방향키로 이동하고, 가까이에서 E 또는 스페이스바로 상호작용하세요.">
                <form class="road-name-screen" id="road-name-screen" novalidate>
                    <label for="road-player-name">나의 이름은?</label>
                    <input id="road-player-name" name="playerName" autocomplete="given-name" required>
                    <p id="road-name-error" role="status" hidden>이름을 입력해 주세요.</p>
                    <button type="submit">시작</button>
                </form>
                <div class="road-world" id="road-world">
                    <img class="road-map" id="road-map" src="./images/backgrounds/home.png" alt="집 주변의 숲길" draggable="false">
                    <img class="road-sign" id="road-sign" src="./images/road/sign-transparent-outline-fixed.png" alt="숲길 표지판" draggable="false" hidden>
                    <button class="road-sign-trigger" id="road-sign-trigger" type="button" aria-label="표지판 읽기" hidden></button>
                    <div class="road-actor road-cat" id="road-cat" aria-label="티니" hidden>
                        <img id="road-cat-sprite" src="./images/character/cat/cat_front.png" alt="티니" draggable="false">
                    </div>
                    <div class="road-actor road-grandmother" id="road-grandmother" aria-label="집 문 앞의 할머니">
                        <img src="./images/character/grandmother/grandmother_front.png" alt="할머니" draggable="false">
                    </div>
                    <div class="road-actor road-player" id="road-player">
                        <img id="road-player-sprite" src="./images/character/player/player.png" alt="플레이어"
                            draggable="false">
                    </div>
                </div>

                <section class="road-sign-overlay" id="road-sign-overlay" role="dialog" aria-modal="true" aria-labelledby="road-sign-title" hidden>
                    <div class="road-sign-panel">
                        <button class="road-sign-close" id="road-sign-close" type="button" aria-label="표지판 닫기">×</button>
                        <h2 id="road-sign-title">표지판</h2>
                        <div class="road-sign-copy" id="road-sign-copy"></div>
                        <button class="road-sign-confirm" id="road-sign-confirm" type="button">확인</button>
                    </div>
                </section>

                <section class="road-dialog" id="road-dialog" role="dialog" aria-labelledby="road-dialog-text" hidden>
                    <div class="road-dialog-portrait" id="road-dialog-portrait" aria-hidden="true" hidden>
                        <img id="road-dialog-portrait-image" alt="" draggable="false">
                    </div>
                    <span class="road-dialog-speaker" id="road-dialog-speaker" hidden></span>
                    <p id="road-dialog-text"></p>
                    <div class="road-dialog-choices" id="road-dialog-choices" hidden></div>
                    <span class="road-dialog-prompt" aria-hidden="true">Space ▶</span>
                </section>
            </div>
        </section>

        <section id="Battle" class="screen" aria-label="Battle 화면">
            <canvas id="battle-canvas"></canvas>
            <section class="enemy-intent" id="enemy-intent" aria-labelledby="enemy-intent-title">
                <h2 id="enemy-intent-title">늑대의 다음 행동 예상</h2>
                <div class="intent-row">
                    <span>공격</span>
                    <progress id="enemy-attack-probability" max="100" value="70" aria-label="늑대가 공격할 가능성"></progress>
                    <output class="intent-probability" id="enemy-attack-probability-value">70%</output>
                </div>
                <div class="intent-row">
                    <span>숨 고르기</span>
                    <progress id="enemy-recover-probability" max="100" value="30" aria-label="늑대가 숨을 고를 가능성"></progress>
                    <output class="intent-probability" id="enemy-recover-probability-value">30%</output>
                </div>
            </section>
            <aside class="battle-history-panel" id="battle-history-panel" aria-labelledby="battle-history-title">
                <div class="battle-history-header">
                    <h2 id="battle-history-title">전투 기록</h2>
                </div>
                <div class="battle-history-navigator">
                    <button id="battle-history-previous" type="button" aria-label="이전 턴">‹</button>
                    <span id="battle-history-turn-label">1턴 / 1턴</span>
                    <button id="battle-history-next" type="button" aria-label="다음 턴">›</button>
                </div>
                <div class="battle-history-cards" aria-live="polite">
                    <article class="battle-history-card">
                        <img src="./images/character/cat/cat_front.png" alt="">
                        <div><h3>추천</h3><p id="battle-history-recommendation">추천을 기다리는 중</p></div>
                    </article>
                    <article class="battle-history-card">
                        <img src="./images/character/player/player_icon.png" alt="">
                        <div><h3>선택</h3><p id="battle-history-choice">아직 선택 전</p></div>
                    </article>
                    <article class="battle-history-card">
                        <img src="./images/battle/history_result_icon.png" alt="전투 결과 아이콘">
                        <div><h3>결과</h3><p id="battle-history-result">전투를 시작하면 결과가 여기에 표시돼요.</p></div>
                    </article>
                </div>
            </aside>
            <section class="battle-status enemy-status" id="enemy-status" aria-label="적 상태">
                <img class="status-portrait" src="./images/character/wolf_icon.png" alt="늑대 얼굴 아이콘">
                <div class="status-heading">
                    <p class="status-name">늑대</p>
                </div>
                <div class="status-row health-row">
                    <span class="status-kind">HP</span>
                    <div class="status-bar health-bar" role="progressbar" aria-label="적 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="enemy-health-value">100 / 100</span>
                </div>
                <div class="status-row stamina-row">
                    <span class="status-kind">스태미나</span>
                    <div class="status-bar stamina-bar enemy-stamina-bar" role="progressbar" aria-label="적 스태미나" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="enemy-stamina-value">100 / 100</span>
                </div>
            </section>
            <section class="battle-status player-status" id="player-status" aria-label="플레이어 상태">
                <img class="status-portrait player-status-portrait" src="./images/character/player/player_status_icon.png" alt="플레이어 아이콘">
                <div class="status-heading">
                    <p class="status-name">플레이어</p>
                </div>
                <div class="status-row health-row">
                    <span class="status-kind">HP</span>
                    <div class="status-bar health-bar" role="progressbar" aria-label="플레이어 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="player-health-value">100 / 100</span>
                </div>
                <div class="status-row stamina-row">
                    <span class="status-kind">스태미나</span>
                    <div class="status-bar stamina-bar" role="progressbar" aria-label="플레이어 스태미나" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <span class="status-fill"></span>
                    </div>
                    <span class="status-value" id="player-stamina-value">100 / 100</span>
                </div>
            </section>
            <section id="fight-skills-dialog" class="fight-skills-dialog" role="dialog" aria-label="다른 행동 선택"
                aria-modal="true" hidden>
                <img class="fight-skills-panel" src="./images/battle/fight_skills_panel.png" alt="">
                <div class="fight-skills-list">
                    <h2>다른 행동 선택</h2>
                    <button type="button" class="fight-skill-button skill-option" aria-label="일반 공격, 위력 10, 명중률 100, 소모 스태미나 20">
                        <span>일반 공격</span><small>위력 10 · 명중률 100% · 스태미나 20</small>
                    </button>
                    <button type="button" class="fight-skill-button skill-option" aria-label="힘껏 휘두르기, 위력 20, 명중률 70, 소모 스태미나 30">
                        <span>힘껏 휘두르기</span><small>위력 20 · 명중률 70% · 스태미나 30</small>
                    </button>
                    <button type="button" class="fight-skill-button skill-option" aria-label="숨 고르기, 체력 10 및 스태미나 40 회복, 소모 스태미나 0">
                        <span>숨 고르기</span><small>체력 10 · 스태미나 40 회복</small>
                    </button>
                    <button type="button" class="fight-skill-button alternate-run-button" id="alternate-run-button">
                        <span>도망 시도</span><small>성공하면 전투를 마치고 숲길로 돌아가요.</small>
                    </button>
                    <button type="button" class="action-choice-cancel" id="action-choice-cancel">돌아가기</button>
                </div>
            </section>
            <dialog id="battle-loss-dialog" class="battle-loss-dialog" aria-labelledby="battle-loss-text">
                <p id="battle-loss-text">다시 해보자</p>
                <button type="button" id="battle-loss-confirm">확인</button>
            </dialog>
            <div class="menu-section">
                <img id="menu-background" src="./images/battle/battle_menu.png" alt="">
                <div id="menu-text">
                    <img class="recommendation-cat" src="./images/character/cat/cat_front.png" alt="">
                    <div class="recommendation-copy">
                        <span id="battle-message-kind" class="battle-message-kind" hidden></span>
                        <p id="ai-recommendation">도망가자! 이길 수 있는 상대가 아니야!</p>
                    </div>
                </div>
                <div class="menu-actions">
                    <button id="follow-recommendation-button" type="button">이대로 할래</button>
                    <button id="choose-action-button" type="button">다른 행동 고를래</button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
